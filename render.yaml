services:
  - type: web
    name: chat-writer
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run deploy:build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: APP_PASSWORD
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ELEVENLABS_API_KEY
        sync: false
